<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>__EDGE_TITLE__</title>
</head>
<body>
  <pre id="out"></pre>
  <script type="module">
    import { createWorker } from "https://cdn.edgepython.com/js/src/index.js";
    // The worker reads the edge.json beside this page, and the page shows what the program prints.
    const out = document.getElementById("out");
    const worker = await createWorker();
    worker.onOutput((text) => out.append(text));
    const { out: error } = await worker.run(await fetch("main.py").then((r) => r.text()), { baseUrl: location.href });
    if (error) out.append(error);
  </script>
</body>
</html>
