<!doctype html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
  <script type="module">
    import { createWorker } from "/js/src/index.js";
    // Progress the CLI reads over CDP, output grows and then done flips with a code or a traceback.
    const st = { out: "", done: false, ok: false, code: 0, err: "" };
    window.__edge = st;
    try {
      // The page reads the project's edge.json from this server for the worker, its imports already locked.
      const worker = await createWorker({ baseUrl: `${location.origin}/` });
      worker.onOutput((text) => { st.out += text });
      // The program and the script it came from, whose directory its relative imports resolve from.
      const { src, entry } = __EDGE_RUN__;
      const res = await worker.run(src, { entry });
      st.code = res && res.exitCode ? res.exitCode : 0;
      if (res && res.out) st.err = res.out;
      else st.ok = true;
    } catch (e) {
      st.err = e && e.message ? e.message : String(e);
    } finally {
      st.done = true;
    }
  </script>
</body>
</html>
